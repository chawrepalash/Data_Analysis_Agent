name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      # The live Gemini smoke test needs an API key, so CI runs everything else.
      # The agent itself is tested with a scripted fake model, so no API calls are made.
      - run: python -m pytest tests -q --ignore=tests/test_agent_smoke.py
